name: Desktop E2E

# The real LaunchDeck window driven through WebDriver (tools/desktop-e2e):
# every suite, on the release build. Too slow for every push, so once a week
# and when started by hand. Linux only: tauri-driver has no macOS support.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 05:23 UTC.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-e2e:
    name: desktop-e2e (ubuntu-24.04)
    # Pinned for the same reason as in ci.yml.
    runs-on: ubuntu-24.04
    # A release build from a cold cache, then minutes of suites.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The pinned toolchain, with the components rust-toolchain.toml lists.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      # Also keeps ~/.cargo/bin, so tauri-driver is built once.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The build packages of ci.yml, then what tools/desktop-e2e/README.md
      # lists: the web view's driver, a display, a credential store, and a
      # window manager with other applications to bring to the front.
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb dbus gnome-keyring openbox xterm wmctrl

      - run: npm ci
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build
        run: npx tauri build --no-bundle
      - name: Desktop suites
        run: python3 tools/desktop-e2e/run.py

      # `.work` is a hidden folder, which an artifact leaves out unless told.
      - name: Keep screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-shots-and-logs
          path: |
            tools/desktop-e2e/.work/shots
            tools/desktop-e2e/.work/logs
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
