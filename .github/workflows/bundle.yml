name: Bundle

# The installable bundles, built when a version tag is pushed or when the
# workflow is started by hand, and kept for 14 days. Nothing is signed with a
# certificate and no secret is used.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 is pinned for the same reason as in ci.yml.
          - os: ubuntu-24.04
            bundles: deb,rpm
            artifact: launchdeck-linux
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          # Apple silicon. The .app is inside the .dmg; it is not uploaded on
          # its own because an artifact does not keep its executable bits.
          - os: macos-latest
            bundles: app,dmg
            artifact: launchdeck-macos
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact: launchdeck-windows
            files: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    # Windows has never been built: its failures are listed, not hidden. Remove once green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # A release build (LTO, one codegen unit) from a cold cache takes longer
    # than the test job's debug build.
    timeout-minutes: 90
    steps:
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The pinned toolchain, with the components rust-toolchain.toml lists.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libxdo-dev libssl-dev rpm

      - run: npm ci
      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Inspect the .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            rpm -qip "$rpm"
          done
      - name: Inspect the .app and .dmg
        if: runner.os == 'macOS'
        run: |
          for app in src-tauri/target/release/bundle/macos/*.app; do
            codesign -dv --verbose "$app"
          done
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
